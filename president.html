<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sivolas</title>

    <style>
        body {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
             flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f0e6;
            color: #173c2d;
        }

        .container{
            margin: auto;
            width: 500px;
            background-color: #faf8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            border: 2px solid #b18a3c;
            outline: 1px solid #b18a3c;
            outline-offset: -10px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.32);
            padding: 20px;
        }
        button{
            width: 100px;
            padding: 8px;
            border: none;
            border-radius: 10px;
            background-color: #1c3581;
            color: white;
            font-size: 17px;
        }
        button:hover{
            cursor: pointer;
            background-color: #14265f;
        }
        #name{
            width: 250px;
            background-color: rgba(66, 219, 181, 0.2);
            color: black;
            height: 50px;
            text-align: center;
            border-radius: 20px;
            font-size: 28px;
        }
        ol{
            width: 250px;
            height: 200px;
            background-color: #f4f0e6;
            color: black;
            border-radius: 20px;
            padding: 0;
            text-align: center;
        }
        li{
            text-align: start;
            list-style-position: inside;
            margin-left: 20px;
            padding: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div style="color: #1c3581; font-size: 40px; font-weight: 700; text-shadow: 0px 2px 20px;">
            Choose Your President
        </div>
    </header>
    <div class="container">

        <button id="take_lot">Take Lot</button>


        <h1 id="name"></h1>


        <h1 style="background : none; text-align: center;font-size: 25px;color:  #1c3581;" id="president"></h1>
        <!-- <ol id="namelist" style="overflow: hidden;">
            <p style="background-color:  #1c3581; color: white; width: 100%; padding: 5px; margin: 0;">Order of Appearance</p>
            
        </ol> -->

    </div>

    <div id="next">

    </div>

    <script>
        let take_lot = document.getElementById('take_lot');
        let name = document.getElementById('name');
        let president =  document.getElementById('president');
        let next = document.getElementById('next')

        let names = ['Adithya','Antony','Devan','Siva','Sreedarsh','Kripa'];

        take_lot.addEventListener("click", (event)=>{

            let num = Math.floor(Math.random() * names.length);
            //console.log(num)

            if(names.length != 0){
                name.textContent = names[num];
                president.innerHTML += `<h1>Congratulations ${names[num]} 🎉</h1>`
                next.innerHTML += `<button onclick="window.location.href='secretary.html'">Choose secratary</button>`
                names.length = 0;
                
            }else{
                name.textContent = 'Lot finished!!!'
            }
            //console.log(names)

        })
    </script>
</body>
</html>
